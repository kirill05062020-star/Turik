name: Build Turik

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Turik-1.21.11
          path: build/libs/*.jar

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Turik 1.0.0 (Minecraft 1.21.11)
          body: |
            Собранный Turik Client для Minecraft Java Edition 1.21.11 (Fabric).
            Файл `Turik-1.21.11-1.0.0.jar` кладите в `.minecraft/mods` вместе с Fabric API 0.141.6+1.21.11.
          files: build/libs/*.jar
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
